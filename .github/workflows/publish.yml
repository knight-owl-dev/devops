name: Publish Images

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  matrix:
    name: Compute build matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      images: ${{ steps.compute.outputs.images }}
      distributable: ${{ steps.compute.outputs.distributable }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release tag
        # Strict vN.N.N only. The tag is the release version; the release PR
        # stamped each changed image's images/<name>/version to it.
        run: ./scripts/validate-version-strict.sh "${{ github.ref_name }}"

      - name: Compute build matrix
        id: compute
        # Builds only images stamped to this release (version == the tag).
        run: ./scripts/compute-build-matrix.sh "${{ github.ref_name }}"

  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    needs: matrix
    if: ${{ needs.matrix.outputs.images != '[]' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    # Each architecture builds on a runner of its own, so no build step runs
    # under QEMU emulation. Each leg pushes its own manifest by digest;
    # `publish` assembles the list.
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.matrix.outputs.images) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ghcr.io/knight-owl-dev/${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load build args
        id: args
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          {
            echo "build_args<<LOCKFILE_EOF"
            sed "s/=local$/=${VERSION}/" "images/${{ matrix.image }}/versions.lock"
            echo "IMAGE_VERSION=${TAG}"
            echo "LOCKFILE_EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # mode=max caches every stage. ci-tools compiles luarocks in a
      # `lua-builder` stage that reaches the final image only through
      # COPY --from, which a final-image-only cache never records.
      #
      # A registry ref and not type=gha: this workflow runs on tag pushes, an
      # Actions cache is readable only from the ref that wrote it and from the
      # default branch, and each release is its own tag — so nothing written
      # here would ever be read back. One ref per arch; the two hold different
      # layers.
      - name: Build and verify
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images/${{ matrix.image }}/
          # Constrains the build to the arch the matrix names. Redundant on a
          # native runner; without it, an arch paired with the wrong runner
          # label builds that runner's platform and the index carries one
          # architecture twice.
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ matrix.image }}:verify
          build-args: ${{ steps.args.outputs.build_args }}
          cache-from: type=registry,ref=ghcr.io/knight-owl-dev/${{ matrix.image }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=ghcr.io/knight-owl-dev/${{ matrix.image }}:buildcache-${{ matrix.arch }},mode=max

      - name: Verify tools
        run: make verify IMAGE=${{ matrix.image }} IMAGE_TAG=${{ matrix.image }}:verify

      - name: Assert scan policy is present
        # trivy-config fails open: a trivy.yaml Trivy cannot read scans with
        # defaults and exits 0, un-gating publish. Rationale in cve-monitor.yml.
        run: |
          if [[ ! -r trivy.yaml ]]; then
            echo "ERROR: trivy.yaml unreadable — the scan would pass without enforcing policy" >&2
            exit 1
          fi

      - name: Scan for vulnerabilities
        # Policy comes from trivy.yaml. Do not add severity/exit-code/
        # ignore-unfixed inputs here — the action turns any input it receives
        # into a TRIVY_* env var, which overrides the config file.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ${{ matrix.image }}:verify
          trivy-config: trivy.yaml
          trivyignores: images/${{ matrix.image }}/.trivyignore.yaml
          # Keep in sync with the Makefile and cve-monitor.yml (see trivy.yaml).
          version: v0.74.0

      # Pushed under its digest with no tag, so neither arch claims :latest on
      # its own. The publish job names them.
      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images/${{ matrix.image }}/
          platforms: linux/${{ matrix.arch }}
          build-args: ${{ steps.args.outputs.build_args }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: true
          cache-from: type=registry,ref=ghcr.io/knight-owl-dev/${{ matrix.image }}:buildcache-${{ matrix.arch }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        # The filename is the digest; the file is empty. The publish job needs
        # only the names.
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          # Long enough to re-run `publish` alone after a transient registry
          # failure; the files are empty, so this costs nothing.
          retention-days: 7

  publish:
    name: Publish ${{ matrix.image }}
    needs: [matrix, build]
    if: ${{ needs.matrix.outputs.images != '[]' }}
    runs-on: ubuntu-latest
    # Tags are named here alone, so this is the only job that can race another
    # release for :latest. Never cancel one midway: a half-published release
    # leaves per-arch manifests with no index naming them.
    concurrency:
      group: publish-${{ matrix.image }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # cosign keyless signing (Fulcio OIDC)
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.matrix.outputs.images) }}
    env:
      IMAGE: ghcr.io/knight-owl-dev/${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Named exactly, one step per architecture. A `digest-<image>-*` pattern
      # is a prefix glob, so an image name that extends another's would pull
      # that image's digests into this merge.
      - name: Download the amd64 digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          name: digest-${{ matrix.image }}-amd64

      - name: Download the arm64 digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          name: digest-${{ matrix.image }}-arm64

      - name: Read the image description
        id: meta
        # From the Dockerfile label, so the index annotation says what the
        # per-arch manifests already carry.
        run: |
          description="$(
            sed -n 's/.*image\.description="\(.*\)"/\1/p' \
              "images/${{ matrix.image }}/Dockerfile"
          )"
          if [[ -z "${description}" ]]; then
            echo "ERROR: images/${{ matrix.image }}/Dockerfile carries no image.description label" >&2
            exit 1
          fi
          echo "description=${description}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The per-arch manifests carry their own labels; annotations belong on the
      # index, which is what a registry UI and a consumer read first.
      - name: Create the manifest list
        working-directory: /tmp/digests
        env:
          TAG: ${{ github.ref_name }}
          DESCRIPTION: ${{ steps.meta.outputs.description }}
        run: |
          # nullglob, or an empty directory leaves the literal '*' as the loop
          # variable and the guard below sees one element rather than none.
          shopt -s nullglob
          refs=()
          for digest in *; do
            refs+=("${IMAGE}@sha256:${digest}")
          done
          # A merge over no digests would tag nothing and exit 0, leaving the
          # release with a tag that resolves to the previous image.
          if [[ ${#refs[@]} -eq 0 ]]; then
            echo "ERROR: no digests downloaded — nothing to merge" >&2
            exit 1
          fi
          echo "merging ${#refs[@]} manifests"
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.description=${DESCRIPTION}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/knight-owl-dev/devops" \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:${TAG}" \
            "${refs[@]}"

      - name: Read the index digest
        id: index
        env:
          TAG: ${{ github.ref_name }}
        # One signature on the index covers both platforms and both tags. The
        # index digest exists only once the merge lands, so it comes back from
        # the registry.
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{.Manifest.Digest}}')"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "index ${digest}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  package:
    name: Package ${{ matrix.image }}
    needs: [matrix, publish]
    if: ${{ needs.matrix.outputs.distributable != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.matrix.outputs.distributable) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract release version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"

      - name: Build release archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/${{ matrix.image }}/package-release.sh "${VERSION}"

      - name: Build deb packages
        uses: ./.github/actions/build-deb
        with:
          image: ${{ matrix.image }}
          version: ${{ steps.version.outputs.version }}

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.image }}
          path: |
            artifacts/release/*.tar.gz
            artifacts/release/*.deb
          if-no-files-found: error

  release:
    name: Create Release
    needs: [matrix, build, publish, package]
    # Always cut a Release for the pushed tag (the changelog anchor). Run even
    # when the build jobs are skipped, but not when one that did run failed.
    # `build` is listed alongside `publish` because a failed build skips
    # publish, and a skipped job is not a failed one.
    if: >-
      !cancelled()
      && needs.matrix.result == 'success'
      && needs.build.result != 'failure'
      && needs.publish.result != 'failure'
      && needs.package.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine packaging set
        id: pkg
        env:
          DISTRIBUTABLE: ${{ needs.matrix.outputs.distributable }}
        run: |
          if [[ "${DISTRIBUTABLE}" != "[]" ]]; then
            echo "has_assets=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_assets=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Download package artifacts
        if: steps.pkg.outputs.has_assets == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: packages-*
          merge-multiple: true # all images' assets land in one directory
          path: artifacts/release

      - name: Generate checksums
        if: steps.pkg.outputs.has_assets == 'true'
        # One combined checksums.txt + release-body.md over every image's assets.
        run: ./scripts/generate-checksums.sh

      - name: Create GitHub release (with assets)
        if: steps.pkg.outputs.has_assets == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        # --notes-file prepends the SHA256 checksums (from generate-checksums.sh)
        # to the auto-generated changelog (from --generate-notes + .github/release.yml).
        run: |
          gh release create "${TAG}" \
            --generate-notes \
            --notes-file artifacts/release/release-body.md \
            artifacts/release/*.tar.gz \
            artifacts/release/*.deb \
            artifacts/release/checksums.txt

      - name: Create GitHub release (changelog only)
        if: steps.pkg.outputs.has_assets != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        # No distributable image changed — publish a changelog-only Release so the
        # tag still anchors a release entry, with no package assets.
        run: gh release create "${TAG}" --generate-notes

  dispatch:
    name: Dispatch ${{ matrix.image }} downstream
    needs: [matrix, release]
    if: ${{ needs.matrix.outputs.distributable != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.matrix.outputs.distributable) }}
    steps:
      - name: Extract release version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: knight-owl-dev
          repositories: |
            apt
            homebrew-tap

      - name: Trigger apt repository update
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh api repos/knight-owl-dev/apt/dispatches \
            -f event_type=release-published \
            -f 'client_payload[versions]='"${IMAGE}:${VERSION}"

      - name: Trigger Homebrew tap update
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh api repos/knight-owl-dev/homebrew-tap/dispatches \
            -f event_type=release-published \
            -f 'client_payload[formulas]='"${IMAGE}:${VERSION}"
