# Suppressed CVEs for the ci-tools image.
#
# Each entry carries a `statement` (justification) and an `expired_at` date.
# When the date passes the entry stops suppressing and the CVE reappears in the
# scan, forcing a re-triage: bump the offending tool if a patched upstream
# release shipped, or extend the date with a fresh justification.
#
# Suppressions only — the rest of the scan policy is shared across images in
# the repo-root trivy.yaml. Trivy does NOT auto-detect this file: every
# invocation names it explicitly (Makefile `--ignorefile`, the trivy-action
# `trivyignores:` input), so a missing file fails the scan. See
# docs/how-to/publish-image.md for the add/extend/remove workflow.
#
# Suppression entry example:
#
#  - id: CVE-YYYY-NNNNN
#    statement: >-
#      <package>: <short description>, fixed in <version>. Affects <tool>
#      <version> — <why the practical risk is negligible here>. Tracking:
#      #NN. Remove once <tool> ships a build on <fixed version>.
#    expired_at: 2026-07-21  # ~45 days out, matching the dependency's cadence
#
vulnerabilities:
  - id: CVE-2026-78667
    statement: >-
      net/http server DoS via crafted Range headers, fixed in Go 1.26.9 /
      1.27.2. Affects shfmt v3.14.1 (Go 1.27.1), which serves no HTTP, so
      practical risk is negligible. Tracking: #299. Remove once shfmt ships
      a build on Go >= 1.26.9 or 1.27.2.
    expired_at: 2026-11-23

  - id: CVE-2026-97031
    statement: >-
      crypto/tls server DoS via repeated ECH outer extension references,
      fixed in Go 1.26.9 / 1.27.2. Affects shfmt v3.14.1 (Go 1.27.1), which
      accepts no TLS connections, so practical risk is negligible. Tracking:
      #299. Remove once shfmt ships a build on Go >= 1.26.9 or 1.27.2.
    expired_at: 2026-11-23

  - id: CVE-2026-78669
    statement: >-
      net/http HTTP/2 DoS via excessive SETTINGS frames, fixed in Go 1.26.9
      / 1.27.2. Affects shfmt v3.14.1 (Go 1.27.1), which speaks no HTTP/2,
      so practical risk is negligible. Tracking: #299. Remove once shfmt
      ships a build on Go >= 1.26.9 or 1.27.2.
    expired_at: 2026-11-23

  - id: CVE-2026-111943
    statement: >-
      crypto/x509 certificate verification flaw enabling man-in-the-middle,
      fixed in Go 1.26.10 / 1.27.3. Affects shfmt v3.14.1 (Go 1.27.1), which
      opens no TLS connections, so practical risk is negligible. Tracking:
      #299. Remove once shfmt ships a build on Go >= 1.26.10 or 1.27.3.
    expired_at: 2026-11-23

  - id: CVE-2026-78661
    statement: >-
      golang.org/x/net/html: quadratic-time DoS on crafted HTML, fixed in
      0.62.0. Affects gh v2.103.3 (x/net 0.60.0) — worst case is a slow gh
      call in an ephemeral CI job, so practical risk is negligible.
      Tracking: #299. Remove once gh ships a build on x/net >= 0.62.0.
    expired_at: 2026-12-23

  - id: CVE-2026-116795
    statement: >-
      re2js: quadratic-time DoS on repeated lookbehind matching, fixed in
      2.8.7. Affects markdownlint-cli2 0.24.0, which pins markdownlint
      0.42.0 and thus re2js 2.8.6 — it only lints the repo's own Markdown,
      so practical risk is negligible. Tracking: #299. Remove once
      markdownlint-cli2 ships on markdownlint >= 0.42.1.
    expired_at: 2026-12-23
