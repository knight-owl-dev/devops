# Suppressed CVEs for the ci-tools image.
#
# Each entry carries a `statement` (justification) and an `expired_at` date.
# When the date passes the entry stops suppressing and the CVE reappears in the
# scan, forcing a re-triage: bump the offending tool if a patched upstream
# release shipped, or extend the date with a fresh justification.
#
# Suppressions only — the rest of the scan policy is shared across images in
# the repo-root trivy.yaml. Trivy does NOT auto-detect this file: every
# invocation names it explicitly (Makefile `--ignorefile`, the trivy-action
# `trivyignores:` input), so a missing file fails the scan. See
# docs/how-to/publish-image.md for the add/extend/remove workflow.
#
# Suppression entry example:
#
#  - id: CVE-YYYY-NNNNN
#    statement: >-
#      <package>: <short description>, fixed in <version>. Affects <tool>
#      <version> — <why the practical risk is negligible here>. Tracking:
#      #NN. Remove once <tool> ships a build on <fixed version>.
#    expired_at: 2026-07-21  # ~45 days out, matching the dependency's cadence
#
vulnerabilities:
  - id: CVE-2026-32280
    statement: >-
      crypto/x509 chain building does unbounded work (DoS), fixed in Go
      1.25.9 / 1.26.2. Affects actionlint v1.7.12 and shfmt v3.13.1 (Go
      1.26.1) — offline lint/format tools with no untrusted network or
      certificate input, so practical risk is negligible. Tracking: #96.
      Remove once both ship builds on Go >= 1.25.9 or 1.26.2.
    expired_at: 2026-09-25

